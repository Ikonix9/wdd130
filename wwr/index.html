<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to SwiftWater Rafting. Discover thrilling white-water rafting trips, experienced guides, and unforgettable river adventures.">
    <title>White Water Rafting Home - SwiftWater Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <!-- Same header/nav as about, contact, trips -->
    </header>
    <main>
        <section class="hero">
            <img src="images/hero-banner.jpg" alt="Rafting team navigating rapids">
            <div class="hero-msg">
                <h1>Conquer the Rapids</h1>
                <p>Unforgettable white-water adventures for every skill level.</p>
                <a href="trips.html" class="cta-button">Explore Our Trips</a>
            </div>
        </section>

        <section class="home-grid">
            <div class="grid-card">
                <img src="images/safety-briefing.jpg" alt="Safety briefing">
                <h3>Safety First</h3>
                <p>Our certified guides ensure a safe and thrilling ride down the river.</p>
            </div>
            <div class="grid-card">
                <img src="images/group_rafting.jpg" alt="Group rafting fun">
                <h3>Group Adventures</h3>
                <p>Bring your family, friends, or corporate team for an epic day out.</p>
            </div>
        </section>

        <section class="newsletter">
            <h2>Join Our Newsletter</h2>
            <form action="#" method="get">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Sign Up</button>
            </form>
        </section>
    </main>
    <footer>
        <!-- Same footer as other pages -->
    </footer>
</body>
</html>
